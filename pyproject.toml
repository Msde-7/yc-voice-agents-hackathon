[project]
name = "yc-voice-agents-hackathon"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aioboto3>=15.5.0",
    "aiohttp>=3.9.0",
    "cekura>=0.1.0",
    "fastapi>=0.115.0",
    "pipecat-ai[gradium,nvidia,runner,silero,webrtc,websocket]>=1.3.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.29",
    "twilio>=9.0.0",
    "uvicorn[standard]>=0.30.0",
    "websockets>=12.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
